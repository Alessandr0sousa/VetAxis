@if (aberto()) {
  <div class="internacao-dialog-overlay">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Alterar Status</h5>
          <button type="button" class="btn-close" (click)="onFechar()"></button>
        </div>

        <form [formGroup]="form()" (ngSubmit)="onSalvar()">
          <div class="modal-body">
            <label class="form-label">Novo status</label>
            <select class="form-select" formControlName="novoStatus">
              <option [ngValue]="null">Selecione</option>
              @for (status of statusPermitidos(); track status) {
                <option [ngValue]="status">{{ getStatusLabel(status) }}</option>
              }
            </select>

            <label class="form-label mt-3">Justificativa (opcional)</label>
            <textarea rows="3" class="form-control" formControlName="justificativa"></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" (click)="onFechar()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
